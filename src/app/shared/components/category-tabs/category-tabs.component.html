<div class="category-tabs" role="tablist">
  <button type="button" class="category-tab" [class.active]="selectedCategoryId === 'all'"
    (click)="selectCategory('all')">All</button>
  <button *ngFor="let category of categories" type="button" class="category-tab"
    [class.active]="selectedCategoryId === category.id"
    (click)="selectCategory(category.id)">
    {{ category.name }}
  </button>
</div>
