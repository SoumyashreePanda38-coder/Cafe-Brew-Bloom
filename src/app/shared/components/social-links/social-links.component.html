<div class="social-links" *ngIf="links">
  <a *ngIf="links.instagram" [href]="links.instagram" target="_blank" rel="noopener">Instagram</a>
  <a *ngIf="links.facebook" [href]="links.facebook" target="_blank" rel="noopener">Facebook</a>
  <a *ngIf="links.youtube" [href]="links.youtube" target="_blank" rel="noopener">YouTube</a>
  <a *ngIf="links.website" [href]="links.website" target="_blank" rel="noopener">Website</a>
</div>
