<header
  class="site-header"
  [class.scrolled]="isScrolled">

  <div class="header-container">

    <!-- Logo -->
    <a
      routerLink="/"
      class="brand">

      <div class="brand-logo">
        <img
          [src]="cafe?.logo || 'assets/cafes/generic/logo.png'"
          [alt]="cafe?.name || 'Café logo'"
          title="{{ cafe?.name || 'Café logo' }}">
      </div>

      <div class="brand-text">

        <span class="brand-name">
          {{ cafe?.name || 'Brew & Bloom' }}
        </span>

        <span class="brand-tagline">
          {{ cafe?.tagline || 'Coffee • Food • Moments' }}
        </span>

      </div>

    </a>


    <!-- Desktop Navigation -->
    <nav class="desktop-nav">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active">
        About
      </a>

      <a
        routerLink="/menu"
        routerLinkActive="active">
        Menu
      </a>

      <a
        routerLink="/gallery"
        routerLinkActive="active">
        Gallery
      </a>

      <a
        routerLink="/offers"
        routerLinkActive="active">
        Offers
      </a>

      <a
        routerLink="/reviews"
        routerLinkActive="active">
        Reviews
      </a>

      <a
        routerLink="/events"
        routerLinkActive="active">
        Events
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active">
        Contact
      </a>

    </nav>


    <!-- Call Button -->
    <a
      class="header-cta"
      [href]="'tel:' + (cafe?.contact?.phone || '')">

      <span class="phone-icon">
        ☎
      </span>

      <span>
        Call Now
      </span>

    </a>


    <!-- Mobile Menu -->
    <button
      class="mobile-menu-button"
      type="button"
      (click)="toggleMenu()"
      [class.open]="mobileMenuOpen"
      aria-label="Toggle mobile menu"
      title="Toggle mobile menu">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>


  <!-- Mobile Navigation -->
  <div
    class="mobile-nav"
    [class.open]="mobileMenuOpen">

    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()">
      Home
    </a>

    <a
      routerLink="/about"
      (click)="closeMenu()">
      About
    </a>

    <a
      routerLink="/menu"
      (click)="closeMenu()">
      Menu
    </a>

    <a
      routerLink="/gallery"
      (click)="closeMenu()">
      Gallery
    </a>

    <a
      routerLink="/offers"
      (click)="closeMenu()">
      Offers
    </a>

    <a
      routerLink="/reviews"
      (click)="closeMenu()">
      Reviews
    </a>

    <a
      routerLink="/events"
      (click)="closeMenu()">
      Events
    </a>

    <a
      routerLink="/contact"
      (click)="closeMenu()">
      Contact
    </a>

  </div>

</header>
